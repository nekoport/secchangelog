services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secchangelog-app
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - secchangelog_data:/app/data
      - secchangelog_uploads:/app/public/uploads
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0750
    expose:
      - "3000"

  caddy:
    image: caddy:2
    container_name: secchangelog-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8086:80"
      - "9445:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  secchangelog_data:
  secchangelog_uploads:
  caddy_data:
  caddy_config:
